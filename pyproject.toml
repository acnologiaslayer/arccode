[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arccode"
version = "0.5.0"
description = "A multi-provider agent harness CLI that routes work to the right model by complexity, cost, performance, and intent, and can spawn agents, import skills, and build new agents/skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahir Musleh" }]
keywords = ["llm", "agent", "harness", "cli", "multi-provider", "anthropic", "openai", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "python-frontmatter>=1.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "anthropic>=0.39",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/acnologiaslayer/arccode"
Repository = "https://github.com/acnologiaslayer/arccode"
Issues = "https://github.com/acnologiaslayer/arccode/issues"

[project.scripts]
arccode = "arccode.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/arccode"]

[tool.ruff]
line-length = 100
target-version = "py310"
