name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (default deps, no extras)
        run: pip install .
      - name: Verify provider SDKs bundled + CLI runs
        run: |
          python -c "import openai, anthropic, arccode"
          arccode version
          arccode whichmodel "fix a bug"
      - name: Install dev extras and run tests
        run: |
          pip install '.[dev]'
          pytest -q
